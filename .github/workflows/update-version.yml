name: Update Firefox DevEdition Version

on:
  # Run immediately when you push to main (good for testing)
  push:
    branches:
      - main
  # Run every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # Allow manual run from Actions tab
  workflow_dispatch:

# REQUIRED: This gives the token permission to commit changes
permissions:
  contents: write

jobs:
  update-devedition-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Firefox version metadata
        run: |
          curl -s https://product-details.mozilla.org/1.0/firefox_versions.json -o firefox.json

      - name: Extract FIREFOX_DEVEDITION version
        run: |
          VERSION=$(jq -r '.FIREFOX_DEVEDITION' firefox.json)
          echo "Found version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # (Optional) Add the logic to update the .spec file here if you used the previous solution
      
      - name: Check for changes
        run: |
          # If you are just updating a version file:
          if [ -f version ]; then
            OLD=$(cat version)
          else
            OLD="none"
          fi
          
          if [ "$OLD" = "$VERSION" ]; then
            echo "Version matches ($OLD). No update needed."
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
          else
            echo "$VERSION" > version
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: Commit and push
        # Only run if we actually found a new version
        if: env.UPDATE_NEEDED == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          
          git add .
          git commit -m "Update DevEdition version to $VERSION"
          git push
