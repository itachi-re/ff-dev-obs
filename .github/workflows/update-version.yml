name: Update Firefox DevEdition Version

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest version from Mozilla
        id: fetch_version
        run: |
          # 1. Get the JSON data
          curl -s https://product-details.mozilla.org/1.0/firefox_versions.json -o firefox.json
          
          # 2. Extract the Developer Edition version (e.g., 146.0b5)
          NEW_VERSION=$(jq -r '.FIREFOX_DEVEDITION' firefox.json)
          echo "Detected latest version: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Check current spec version
        id: check_version
        run: |
          # Extract the current version from your spec file
          # Looks for the line starting with "Version:" and grabs the second word
          CURRENT_VERSION=$(grep "^Version:" ff-dev-edition.spec | awk '{print $2}')
          echo "Current spec version: $CURRENT_VERSION"
          
          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ]; then
            echo "Version match. No update needed."
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
          else
            echo "New version found! Updating..."
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: Update Spec File
        if: env.UPDATE_NEEDED == 'true'
        run: |
          # Use regex to replace the Version line, preserving your spacing
          # This finds "Version: (whitespace) (anything)" and replaces it
          sed -i "s/^Version:\s\+.*/Version:        $NEW_VERSION/" ff-dev-edition.spec
          
          # Optional: Verify the change
          grep "^Version:" ff-dev-edition.spec

      - name: Commit and Push
        if: env.UPDATE_NEEDED == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add ff-dev-edition.spec
          git commit -m "Update Firefox DevEdition to $NEW_VERSION"
          git push
