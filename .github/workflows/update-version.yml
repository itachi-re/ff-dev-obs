name: Update Firefox DevEdition Version

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6  # v6 — Node.js 24, latest stable

      - name: Fetch latest version from Mozilla
        id: fetch_version
        run: |
          curl -s https://product-details.mozilla.org/1.0/firefox_versions.json -o firefox.json
          NEW_VERSION=$(jq -r '.FIREFOX_DEVEDITION' firefox.json)
          echo "Detected latest version: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Check current spec version
        id: check_version
        run: |
          CURRENT_VERSION=$(grep "^Version:" ff-dev-edition.spec | awk '{print $2}')
          echo "Current spec version: $CURRENT_VERSION"

          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ]; then
            echo "Version match. No update needed."
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
          else
            echo "New version found: $NEW_VERSION (was $CURRENT_VERSION)"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: Update Spec File
        if: env.UPDATE_NEEDED == 'true'
        run: |
          sed -i "s/^Version:\s\+.*/Version:        $NEW_VERSION/" ff-dev-edition.spec
          grep "^Version:" ff-dev-edition.spec

      - name: Commit and Push
        if: env.UPDATE_NEEDED == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add ff-dev-edition.spec
          git commit -m "chore: update Firefox DevEdition to $NEW_VERSION"
          git push
